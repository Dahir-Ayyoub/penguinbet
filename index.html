
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PenguinBet | Premium Social Arcade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050507;
      color: #e2e8f0;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0d0d12;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    
    @keyframes snow-drift {
      0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(110vh) translateX(40px); opacity: 0; }
    }
    .snowflake {
      position: absolute;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: snow-drift linear infinite;
      filter: blur(1px);
    }

    .frost-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .neon-glow-pink { box-shadow: 0 0 20px rgba(236, 72, 153, 0.4); }
    .neon-glow-blue { box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
    .neon-glow-emerald { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
    .neon-glow-orange { box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }
    
    .icy-gradient {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-float { animation: float 3s ease-in-out infinite; }

    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(2); opacity: 0; }
    }
    .pulse-ring::before {
      content: '';
      position: absolute;
      inset: -10px;
      border: 2px solid currentColor;
      border-radius: inherit;
      animation: pulse-ring 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .clip-path-v { clip-path: polygon(0% 0%, 100% 0%, 50% 100%); }

    /* 3D Dice Transformations */
    .perspective-1000 { perspective: 1000px; }
    .preserve-3d { transform-style: preserve-3d; }
    .translate-z-16 { transform: translateZ(64px); }
    .-translate-z-16 { transform: translateZ(-64px); }
    .rotate-y-180 { transform: rotateY(180deg) translateZ(64px); }
    .rotate-y-90 { transform: rotateY(90deg) translateZ(64px); }
    .-rotate-y-90 { transform: rotateY(-90deg) translateZ(64px); }
    .rotate-x-90 { transform: rotateX(90deg) translateZ(64px); }
    .-rotate-x-90 { transform: rotateX(-90deg) translateZ(64px); }

    .rotate-x-12 { transform: rotateX(12deg); }
    .rotate-y-12 { transform: rotateY(12deg); }

    @keyframes dice-roll {
      0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
      25% { transform: rotateX(180deg) rotateY(90deg) rotateZ(45deg); }
      50% { transform: rotateX(360deg) rotateY(270deg) rotateZ(90deg); }
      75% { transform: rotateX(540deg) rotateY(360deg) rotateZ(135deg); }
      100% { transform: rotateX(720deg) rotateY(720deg) rotateZ(180deg); }
    }
    .animate-dice-roll {
      animation: dice-roll 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .animate-spin-slow {
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

  </style>
<script type="importmap">
{
